# huntd/config/portals.example.yml
# Copy this to config/portals.yml and customize.
# config/portals.yml is gitignored.
#
# To add a company, just tell your AI: "Add [Company] to my tracked companies"
# It will auto-detect the ATS — no need to know Greenhouse vs. Ashby etc.

