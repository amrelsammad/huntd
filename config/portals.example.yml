filters:
  title:
    # Job must match at least one of these keywords (case-insensitive, partial match)
    # Customize to your target roles during /huntd setup
    required_any:
      - "Product"
      - "PM"
      - "Program Manager"
    # Job is excluded if it matches any of these
    excluded:
      - "Intern"
      - "Entry Level"
      - "Junior"
      - "Marketing"
      - "Sales"
      - "Recruiter"
      - "HR"

  location:
    # Job must match at least one of these (empty list = allow all locations)
    allow:
      - "Remote"
      - "UAE"
      - "Dubai"
      - "Abu Dhabi"
      - "Sharjah"
      - "Saudi Arabia"
      - "Riyadh"
      - "Jeddah"
    block: []

# Search queries run during /huntd scan inside an AI session (Claude, Gemini, or Codex).
# NOT run by the automated cron — those only hit ATS APIs.
# Each query is a Google site-filtered search. Customize role keywords to match your targets.
search_queries:
  # Bayt — dominant MENA job portal
  - "site:bayt.com \"product manager\" UAE"
  - "site:bayt.com \"senior product manager\" Dubai"
  - "site:bayt.com \"head of product\" Saudi Arabia"

  # GulfTalent — professional jobs in GCC
  - "site:gulftalent.com \"product manager\" UAE"
  - "site:gulftalent.com \"senior product\" Dubai"

  # LinkedIn — via Google's index
  - "site:linkedin.com/jobs \"product manager\" Dubai"
  - "site:linkedin.com/jobs \"head of product\" Riyadh"
