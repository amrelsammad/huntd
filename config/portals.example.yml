filters:
  title:
    # Job must match at least one of these keywords (case-insensitive, partial match)
    required_any:
      - "Product"
      - "PM"
      - "Program Manager"
    # Job is excluded if it matches any of these
    excluded:
      - "Intern"
      - "Entry Level"
      - "Junior"
      - "Marketing"
      - "Sales"
      - "Recruiter"
      - "HR"

  location:
    # Job must match at least one of these (empty = allow all locations)
    allow:
      - "Remote"
      - "UAE"
      - "Dubai"
      - "Abu Dhabi"
      - "Saudi Arabia"
      - "Riyadh"
      # For global roles, add: "United States", "Amsterdam", "Berlin", etc.
    # Job is excluded if it matches any of these
    block:
      - "On-site only"

# Search queries run during /huntd scan inside an AI session (Claude or Gemini).
# NOT run by the automated cron (scripts/scan.py) — those only hit ATS APIs.
# Each query is a Google site-filtered search. Source is inferred from the site: domain.
# Customize role keywords to match your target roles.
search_queries:
  # Bayt — dominant MENA job portal
  - "site:bayt.com \"product manager\" UAE"
  - "site:bayt.com \"senior product manager\" Dubai"
  - "site:bayt.com \"head of product\" Saudi Arabia"

  # GulfTalent — professional jobs in GCC
  - "site:gulftalent.com \"product manager\" UAE"
  - "site:gulftalent.com \"senior product\" Dubai"

  # LinkedIn — via Google's index (stale by hours but no ToS risk)
  - "site:linkedin.com/jobs \"product manager\" Dubai"
  - "site:linkedin.com/jobs \"head of product\" Riyadh"
