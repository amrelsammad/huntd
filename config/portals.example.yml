# huntd/config/portals.example.yml
# UAE & KSA companies — manually verified ATS assignments and board slugs.
# Copy this to config/portals.yml and customize, or run /huntd setup to auto-generate.
#
# To add a company: tell your AI "Add [Company] to my tracked companies"
# It will auto-detect the ATS — no need to know Greenhouse vs. Workable etc.

